name = "north-hanover-grille"
compatibility_date = "2025-10-11"
pages_build_output_dir = "dist"

# Bindings are attached after first deploy:
#   npx wrangler kv namespace create SITE_KV
#   npx wrangler r2 bucket create nhg-media
# Then fill in the IDs below and redeploy.

# [[kv_namespaces]]
# binding = "SITE_KV"
# id = "REPLACE_WITH_KV_ID"

# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "nhg-media"

[vars]
# Override in Cloudflare Pages → Settings → Environment variables
# ADMIN_PIN and SESSION_SECRET should be set as secrets, not committed.
TIMEZONE = "America/New_York"
